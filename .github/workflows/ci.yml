name: CI

# Offline only: no job here has an API key, and the tests refuse any LexAPI
# base URL that is not a 127.0.0.1 stub.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/gdpr-research-assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/gdpr-research-assistant/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  python-langchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/langchain-eu-law-rag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # langchain-lexapi is installed from its repository (it is not on PyPI yet).
      # Probe anonymously - no token, no credential helper, no prompt - whether
      # that repository is reachable; if not, skip the rest instead of failing.
      # Remove this probe and the `if:` conditions once the repository is public,
      # so that a failed probe can never hide a failing job.
      - id: adapter
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: ""
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          if git -c credential.helper= ls-remote https://github.com/Lex-API/lexapi-langchain HEAD > /dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::langchain-lexapi is not publicly installable yet; this job runs once it is."
          fi
      - if: steps.adapter.outputs.reachable == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/langchain-eu-law-rag/pyproject.toml
      - if: steps.adapter.outputs.reachable == 'true'
        run: pip install -e ".[dev]"
      - if: steps.adapter.outputs.reachable == 'true'
        run: ruff check .
      - if: steps.adapter.outputs.reachable == 'true'
        run: ruff format --check .
      - if: steps.adapter.outputs.reachable == 'true'
        run: mypy
      - if: steps.adapter.outputs.reachable == 'true'
        run: pytest -q
